<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardrail Gazette — 20-Day Companion</title>
<style>
  :root{
    --paper:#eae4d6;
    --paper-raised:#f2ede1;
    --ink:#211d17;
    --ink-soft:#5a5347;
    --rule:#c9bfa8;
    --crimson:#8c2f2f;
    --crimson-dim:#c9a3a3;
    --gold:#a9834b;
    --gold-dim:#d9c69f;
    --serif:'Georgia','Iowan Old Style','Times New Roman',serif;
    --mono:'SF Mono','Consolas','Liberation Mono',monospace;
    --sans:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.5;}

  .masthead{
    text-align:center;
    padding:30px 20px 20px;
    border-bottom:3px double var(--ink);
  }
  .masthead .issue-line{
    display:flex; justify-content:space-between; max-width:720px; margin:0 auto 6px;
    font-family:var(--mono); font-size:11px; color:var(--ink-soft); letter-spacing:.03em;
  }
  .masthead h1{
    font-family:var(--serif); font-size:44px; margin:6px 0 4px; letter-spacing:.01em; font-weight:700;
  }
  .masthead .tagline{font-family:var(--serif); font-style:italic; font-size:14px; color:var(--ink-soft);}
  .rule-thin{border-top:1px solid var(--rule); max-width:720px; margin:10px auto 0;}

  main{max-width:820px; margin:0 auto; padding:32px 24px 80px;}

  .progress-bar-row{display:flex; align-items:center; gap:14px; margin-bottom:30px;}
  .progress-track{flex:1; height:6px; background:var(--rule); border-radius:3px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--crimson); width:0%; transition:width .3s;}
  .progress-label{font-family:var(--mono); font-size:12px; color:var(--ink-soft); white-space:nowrap;}

  .week-block{margin-bottom:34px;}
  .week-title{
    font-family:var(--serif); font-size:19px; font-weight:700; margin:0 0 4px 0;
  }
  .week-sub{font-size:13px; color:var(--ink-soft); margin:0 0 14px 0;}

  .day-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px;}
  .day-card{
    background:var(--paper-raised);
    border:1px solid var(--rule);
    padding:14px 16px;
    cursor:pointer;
    position:relative;
  }
  .day-card:hover{border-color:var(--crimson);}
  .day-card.done{border-left:4px solid var(--crimson);}
  .day-card .num{font-family:var(--mono); font-size:11px; color:var(--ink-soft);}
  .day-card h4{font-family:var(--serif); font-size:15.5px; margin:4px 0 6px 0;}
  .day-card .tag{font-size:11px; color:var(--gold); font-family:var(--mono);}
  .day-card .badge-check{position:absolute; top:12px; right:12px; font-size:14px; color:var(--crimson); display:none;}
  .day-card.done .badge-check{display:block;}

  /* ---- Day view ---- */
  .back-link{font-family:var(--mono); font-size:12px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; margin-bottom:18px; display:inline-block;}
  .day-header{margin-bottom:20px;}
  .day-header .num{font-family:var(--mono); font-size:12px; color:var(--crimson);}
  .day-header h2{font-family:var(--serif); font-size:28px; margin:6px 0 6px 0;}
  .day-header .tag{font-family:var(--mono); font-size:12px; color:var(--gold); border:1px solid var(--gold-dim); padding:3px 10px; border-radius:12px; display:inline-block;}

  .bullets{list-style:none; margin:0 0 26px 0; padding:0;}
  .bullets li{
    padding:12px 0 12px 22px; border-bottom:1px solid var(--rule);
    position:relative; font-size:15px;
  }
  .bullets li::before{content:"§"; position:absolute; left:0; color:var(--crimson); font-family:var(--serif);}

  .quiz-block{background:var(--paper-raised); border:1px solid var(--rule); padding:20px; margin-bottom:16px;}
  .quiz-block .q{font-family:var(--serif); font-size:16px; font-weight:700; margin:0 0 14px 0;}
  .qopt{
    display:block; width:100%; text-align:left; background:var(--paper); border:1px solid var(--rule);
    color:var(--ink); padding:10px 14px; margin-bottom:8px; cursor:pointer; font-family:var(--sans); font-size:14px;
  }
  .qopt:hover{border-color:var(--gold);}
  .qopt.correct{border-color:var(--crimson); background:#f3e6e6;}
  .qopt.wrong{border-color:var(--ink-soft); background:#ece5d5; text-decoration:line-through; color:var(--ink-soft);}
  .qexplain{font-size:13.5px; color:var(--ink-soft); margin-top:10px; padding-top:10px; border-top:1px dashed var(--rule); display:none;}

  .claim-row{text-align:center; margin-top:28px;}
  .claim-btn{
    font-family:var(--serif); font-size:16px; font-weight:700; background:var(--crimson); color:var(--paper);
    border:none; padding:14px 32px; cursor:pointer;
  }
  .claim-btn:disabled{background:var(--rule); cursor:not-allowed; color:var(--ink-soft);}
  .claim-hint{font-size:12.5px; color:var(--ink-soft); margin-top:8px;}

  /* ---- Badge view ---- */
  .badge-screen{text-align:center;}
  .badge-screen h3{font-family:var(--serif); font-size:22px; margin-bottom:18px;}
  #badgeSvgHolder{display:inline-block; margin-bottom:20px;}
  .name-input-row{margin:0 auto 20px; max-width:320px;}
  .name-input-row input{
    width:100%; padding:10px 12px; font-family:var(--sans); font-size:14px; border:1px solid var(--rule); background:var(--paper-raised);
  }
  .download-btn{
    font-family:var(--sans); font-weight:600; font-size:14px; background:var(--ink); color:var(--paper);
    border:none; padding:12px 24px; cursor:pointer; margin-right:10px;
  }
  .continue-btn{
    font-family:var(--sans); font-size:14px; background:none; color:var(--ink-soft); border:1px solid var(--rule);
    padding:12px 24px; cursor:pointer;
  }
</style>
</head>
<body>

    {n:1, title:"Week 1 \u2014 Global Compliance Foundations", sub:"EU AI Act \u00b7 NIST AI RMF \u00b7 ISO 42001 \u00b7 the jurisdiction patchwork"},
    {n:2, title:"Week 2 \u2014 OWASP LLM Top 10, Part 1", sub:"LLM01 through LLM05"},
    {n:3, title:"Week 3 \u2014 OWASP LLM Top 10, Part 2", sub:"LLM06 through LLM10"},
    {n:4, title:"Week 4 \u2014 Frontier, Synthesis, Capstone", sub:"Agentic Top 10 \u00b7 MITRE ATLAS \u00b7 synthesis \u00b7 final certification"}
  ];

  let html = `
    <div class="progress-bar-row">
      <div class="progress-track"><div class="progress-fill" style="width:${(totalDone()/DAYS.length*100)}%"></div></div>
      <div class="progress-label">${totalDone()} / ${DAYS.length} DISPATCHES CLAIMED</div>
    </div>
  `;

  weeks.forEach(w => {
    const days = DAYS.filter(d => d.week === w.n);
    html += `
      <div class="week-block">
        <h3 class="week-title">${w.title}</h3>
        <p class="week-sub">${w.sub}</p>
        <div class="day-grid">
          ${days.map(d => `
            <div class="day-card ${solved[d.day] ? 'done' : ''}" onclick="openDay(${d.day})">
              <span class="badge-check">\u2713</span>
              <div class="num">DAY ${String(d.day).padStart(2,'0')}</div>
              <h4>${d.title}</h4>
              <div class="tag">${d.tag}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });

  main.innerHTML = html;
}

function openDay(day){
  currentDay = day;
  if (!quizState[day]) quizState[day] = {answered:[false,false], correct:[false,false]};
  renderDay();
}

function renderDay(){
  const d = DAYS.find(x => x.day === currentDay);
  const qs = quizState[d.day];
  const main = document.getElementById('main');

  main.innerHTML = `
    <button class="back-link" onclick="renderBoard()">\u2190 Back to the board</button>
    <div class="day-header">
      <div class="num">DISPATCH NO. ${String(d.day).padStart(2,'0')}</div>
      <h2>${d.title}</h2>
      <span class="tag">${d.tag}</span>
    </div>
    <ul class="bullets">
      ${d.bullets.map(b => `<li>${b}</li>`).join('')}
    </ul>
    ${d.quiz.map((q, qi) => `
      <div class="quiz-block">
        <p class="q">Check ${qi+1}. ${q.q}</p>
        ${q.options.map((opt, oi) => `<button class="qopt" data-day="${d.day}" data-qi="${qi}" data-oi="${oi}" onclick="answer(${d.day},${qi},${oi})">${opt}</button>`).join('')}
        <div class="qexplain" id="explain-${qi}">${q.explain}</div>
      </div>
    `).join('')}
    <div class="claim-row">
      <button class="claim-btn" id="claimBtn" onclick="claimBadge(${d.day})" ${allCorrect(d.day) ? '' : 'disabled'}>
        ${solved[d.day] ? 'View Your Badge Again' : 'Claim Today\u2019s Badge'}
      </button>
      <p class="claim-hint">${allCorrect(d.day) ? '' : 'Answer both checks correctly to unlock today\u2019s badge.'}</p>
    </div>
  `;

  // repaint any already-answered state
  qs.answered.forEach((ans, qi) => {
    if (ans) paintAnswered(d.day, qi);
  });
}

function allCorrect(day){
  const qs = quizState[day];
  return qs.correct[0] && qs.correct[1];
}

function answer(day, qi, oi){
  const d = DAYS.find(x => x.day === day);
  const q = d.quiz[qi];
  quizState[day].answered[qi] = true;
  quizState[day].correct[qi] = (oi === q.answer);
  paintAnswered(day, qi, oi);
  document.getElementById('claimBtn').disabled = !allCorrect(day);
  document.querySelector('.claim-hint').textContent = allCorrect(day) ? '' : 'Answer both checks correctly to unlock today\u2019s badge.';
}

function paintAnswered(day, qi, chosenOi){
  const d = DAYS.find(x => x.day === day);
  const q = d.quiz[qi];
  const buttons = document.querySelectorAll(`.qopt[data-day="${day}"][data-qi="${qi}"]`);
  buttons.forEach(b => {
    b.disabled = true;
    const oi = parseInt(b.dataset.oi, 10);
    if (oi === q.answer) b.classList.add('correct');
    else if (chosenOi !== undefined && oi === chosenOi) b.classList.add('wrong');
  });
  document.getElementById(`explain-${qi}`).style.display = 'block';
}

function claimBadge(day){
  solved[day] = true;
  renderBadgeScreen(day);
}

function renderBadgeScreen(day){
  const d = DAYS.find(x => x.day === day);
  const main = document.getElementById('main');
  main.innerHTML = `
    <button class="back-link" onclick="renderDay()">\u2190 Back to dispatch</button>
    <div class="badge-screen">
      <h3>${d.capstone ? 'Certificate Unlocked' : 'Badge Unlocked'}</h3>
      ${d.capstone ? `
        <div class="name-input-row">
          <input type="text" id="nameInput" placeholder="Your name (for the certificate)" oninput="renderBadgeSvg(${day})">
        </div>
      ` : ''}
      <div id="badgeSvgHolder"></div>
      <div>
        <button class="download-btn" onclick="downloadBadge(${day})">Download as PNG</button>
        <button class="continue-btn" onclick="renderBoard()">Back to the board</button>
      </div>
    </div>
  `;
  renderBadgeSvg(day);
}

function todayStamp(){
  const d = new Date();
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

function renderBadgeSvg(day){
  const d = DAYS.find(x => x.day === day);
  const name = d.capstone ? (document.getElementById('nameInput')?.value || '') : '';
  const svg = d.capstone ? capstoneSvg(d, name) : dailySvg(d);
  document.getElementById('badgeSvgHolder').innerHTML = svg;
}

function wrapText(text, maxChars){
  const words = text.split(' ');
  const lines = [];
  let current = '';
  words.forEach(w => {
    if ((current + ' ' + w).trim().length > maxChars){
      lines.push(current.trim());
      current = w;
    } else {
      current = (current + ' ' + w).trim();
    }
  });
  if (current) lines.push(current);
  return lines;
}

function dailySvg(d){
  const titleLines = wrapText(d.title, 24);
  const titleY = 158;
  const titleTspans = titleLines.map((line, i) =>
    `<text x="160" y="${titleY + i*20}" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#211d17">${escapeXml(line)}</text>`
  ).join('');
  return `
  <svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
    <rect width="320" height="320" fill="#eae4d6"/>
    <circle cx="160" cy="160" r="150" fill="#f2ede1" stroke="#a9834b" stroke-width="5"/>
    <circle cx="160" cy="160" r="128" fill="none" stroke="#8c2f2f" stroke-width="2"/>
    <text x="160" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#5a5347">GUARDRAIL GAZETTE</text>
    <text x="160" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#211d17">DAY ${String(d.day).padStart(2,'0')}</text>
    ${titleTspans}
    <text x="160" y="240" text-anchor="middle" font-family="SF Mono, Consolas, monospace" font-size="11" fill="#8c2f2f">${escapeXml(d.tag)}</text>
    <text x="160" y="258" text-anchor="middle" font-family="SF Mono, Consolas, monospace" font-size="10" fill="#5a5347">${todayStamp()}</text>
  </svg>`;
}

function capstoneSvg(d, name){
  return `
  <svg width="460" height="380" viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg">
    <rect width="460" height="380" fill="#eae4d6"/>
    <rect x="14" y="14" width="432" height="352" fill="none" stroke="#a9834b" stroke-width="3"/>
    <rect x="26" y="26" width="408" height="328" fill="#f2ede1" stroke="#8c2f2f" stroke-width="2"/>
    <text x="230" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#5a5347">GUARDRAIL GAZETTE</text>
    <text x="230" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#8c2f2f">CERTIFICATE OF COMPLETION</text>
    <line x1="150" y1="138" x2="310" y2="138" stroke="#a9834b" stroke-width="1"/>
    <text x="230" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-style="italic" fill="#211d17">${name ? escapeXml(name) : 'AI Security Trainee'}</text>
    <text x="230" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#5a5347">has completed the 20-Day Sprint</text>
    <text x="230" y="244" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#211d17">AI Risk Fundamentals</text>
    <text x="230" y="292" text-anchor="middle" font-family="SF Mono, Consolas, monospace" font-size="9" letter-spacing="0.5" fill="#8c2f2f">GLOBAL COMPLIANCE &#183; OWASP LLM TOP 10</text>
    <text x="230" y="306" text-anchor="middle" font-family="SF Mono, Consolas, monospace" font-size="9" letter-spacing="0.5" fill="#8c2f2f">AGENTIC ASI TOP 10 &#183; MITRE ATLAS</text>
    <text x="230" y="335" text-anchor="middle" font-family="SF Mono, Consolas, monospace" font-size="11" fill="#5a5347">${todayStamp()}</text>
  </svg>`;
}

function escapeXml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function downloadBadge(day){
  const d = DAYS.find(x => x.day === day);
  const svgEl = document.querySelector('#badgeSvgHolder svg');
  const svgString = new XMLSerializer().serializeToString(svgEl);
  const svgBlob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = function(){
    const canvas = document.createElement('canvas');
    canvas.width = svgEl.width.baseVal.value * 2;
    canvas.height = svgEl.height.baseVal.value * 2;
    const ctx = canvas.getContext('2d');
    ctx.scale(2,2);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob(function(blob){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = d.capstone ? 'guardrail-gazette-certificate.png' : `guardrail-gazette-day-${String(d.day).padStart(2,'0')}-badge.png`;
      a.click();
    });
  };
  img.src = url;
}

renderBoard();
</script>
</body>
</html>
